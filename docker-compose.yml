x-common-django:
  &default-common-django
  image: ${COMPOSE_PROJECT_NAME}/geonode:${GEONODE_BASE_IMAGE_VERSION}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    # - './src:/usr/src/project'  # Uncomment for local development
    - statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    - backup-restore:/backup_restore
    - data:/data
    - tmp:/tmp
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # Our custom django application. It includes Geonode.
  django:
    << : *default-common-django
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: django4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl -m 10 --fail --silent --output /dev/null http://django:8000/"
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2
    environment:
      - IS_CELERY=False
    entrypoint: ["/usr/src/project/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/project/uwsgi.ini"

  # Celery worker that executes celery tasks created by Django.
  celery:
    << : *default-common-django
    container_name: celery4${COMPOSE_PROJECT_NAME}
    environment:
      - IS_CELERY=True
    entrypoint: ["/usr/src/project/entrypoint.sh"]
    command: "celery-cmd"
    healthcheck:
      test: "celery -b ${BROKER_URL} inspect ping"
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 2

  # Nginx serving django static/media and proxies to django/geonode
  nginx:
    image: ${COMPOSE_PROJECT_NAME}/nginx:${NGINX_BASE_IMAGE_VERSION}
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${NGINX_BASE_IMAGE_VERSION}
    container_name: nginx4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    environment:
      - RESOLVER=127.0.0.11
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics
    restart: unless-stopped
    healthcheck:
      test: "if ps -o pid | grep -w 1 > /dev/null; then echo 'nginx running'; else exit 1;fi"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Gets and installs letsencrypt certificates
  letsencrypt:
    image: ${COMPOSE_PROJECT_NAME}/letsencrypt:${LETSENCRYPT_BASE_IMAGE_VERSION}
    build:
      context: ./docker/letsencrypt
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${LETSENCRYPT_BASE_IMAGE_VERSION}
    container_name: letsencrypt4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    volumes:
      - nginx-certificates:/geonode-certificates
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

  # Geoserver backend
  geoserver:
    image: ${COMPOSE_PROJECT_NAME}/geoserver:${GEOSERVER_BASE_IMAGE_VERSION}
    build:
      context: ./docker/geoserver
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${GEOSERVER_BASE_IMAGE_VERSION}
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://geoserver:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - data:/data
      - tmp:/tmp
      - type: bind
        source: ${SIG_DATA_PATH:-D:/SIG_DATA}
        target: /SIG_DATA
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy

  # Creates the configured GeoServer administrator on a fresh data volume.
  geoserver-init:
    image: ${COMPOSE_PROJECT_NAME}/geoserver:${GEOSERVER_BASE_IMAGE_VERSION}
    container_name: geoserver-init4${COMPOSE_PROJECT_NAME}
    entrypoint: ["/usr/local/tomcat/tmp/bootstrap-admin.sh"]
    env_file:
      - .env
    environment:
      - GEOSERVER_BOOTSTRAP_USER=${GEOSERVER_BOOTSTRAP_USER:-admin}
      - GEOSERVER_BOOTSTRAP_PASSWORD=${GEOSERVER_BOOTSTRAP_PASSWORD:-geoserver}
    restart: "no"
    depends_on:
      geoserver:
        condition: service_healthy

  # Standalone MapStore application, separate from GeoNode's integrated client.
  mapstore:
    image: ${MAPSTORE_IMAGE:-geosolutionsit/mapstore2:v2026.03.00-stable}
    container_name: mapstore4${COMPOSE_PROJECT_NAME}
    environment:
      INITIAL_ADMIN_PASSWORD: ${MAPSTORE_INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - mapstore-data:/usr/local/tomcat/datadir
    restart: unless-stopped

  # Same-origin gateway for MapStore and GeoServer WMS requests.
  mapstore-gateway:
    image: ${COMPOSE_PROJECT_NAME}/mapstore-gateway:1.31.8-alpine
    build:
      context: ./docker/mapstore-gateway
      dockerfile: Dockerfile
    container_name: mapstore-gateway4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    ports:
      - "${MAPSTORE_PORT:-8081}:80"
    volumes:
      - ./docker/mapstore-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mapstore:
        condition: service_started
      mapstore-reader-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Creates/verifies a dedicated, non-admin GeoServer account for standalone MapStore.
  mapstore-reader-init:
    image: ${COMPOSE_PROJECT_NAME}/geoserver:${GEOSERVER_BASE_IMAGE_VERSION}
    entrypoint: ["/bin/bash", "/usr/local/tomcat/tmp/bootstrap-mapstore-reader.sh"]
    env_file:
      - .env
    volumes:
      - ./docker/geoserver/bootstrap-mapstore-reader.sh:/usr/local/tomcat/tmp/bootstrap-mapstore-reader.sh:ro
    depends_on:
      geoserver:
        condition: service_healthy
    restart: "no"

  # PostGIS database.
  db:
    image: ${COMPOSE_PROJECT_NAME}/postgis:${POSTGRES_BASE_IMAGE_VERSION}
    build:
      context: ./docker/postgresql
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_VERSION=${POSTGRES_BASE_IMAGE_VERSION}
    command: postgres -c "max_connections=${POSTGRESQL_MAX_CONNECTIONS}"
    container_name: db4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      # uncomment to enable remote connections to postgres
      #ports:
      #  - "5432:5432"

  # Vanilla Redis service. This is needed by celery
  redis:
    image: redis:8-alpine
    container_name: redis4${COMPOSE_PROJECT_NAME}
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  nginx-confd:
    name: ${COMPOSE_PROJECT_NAME}-nginxconfd
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME}-nginxcerts
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  dbdata:
    name: ${COMPOSE_PROJECT_NAME}-dbdata
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
  redisdata:
    name: ${COMPOSE_PROJECT_NAME}-redisdata
  mapstore-data:
    name: ${COMPOSE_PROJECT_NAME}-mapstore-data
